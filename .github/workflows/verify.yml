name: Verify Foundation Slice

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tan_erp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tan_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 24.20.0
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "24.20.0"
          cache: "npm"

      - name: Setup .NET SDK 10.0.400
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: "10.0.400"

      # Service containers cannot override the entrypoint arguments, so reuse the repository's own compose definition.
      - name: Start Firebase Auth Emulator
        run: docker compose -f deploy/compose.yml up -d firebase-emulator

      - name: Verify Git whitespace and line endings
        run: git diff --check

      - name: Security and architectural policy checks
        run: |
          echo "Running secret and policy scan..."
          # 1. No committed private keys or service account credentials (docs only describe the patterns)
          if git grep -E "BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY" -- ':!*.test.*' ':!*tests*' ':!docs'; then
            echo "ERROR: Private key detected in repository!"
            exit 1
          fi
          if git grep -E '"type":\s*"service_account"' -- ':!*.test.*' ':!*tests*' ':!docs'; then
            echo "ERROR: GCP Service Account JSON detected in repository!"
            exit 1
          fi

          # 2. No Firebase Admin in frontend
          if git grep -i "firebase-admin" frontend/src; then
            echo "ERROR: Frontend must never reference firebase-admin!"
            exit 1
          fi

          # 3. No Raw SQL in Domain, Application or API projects (EF Core owns writes/queries)
          if git grep -E "(SELECT\s+.+\s+FROM|INSERT\s+INTO|UPDATE\s+.+\s+SET|DELETE\s+FROM)" backend/src/TanErp.Domain backend/src/TanErp.Application backend/src/TanErp.Api; then
            echo "ERROR: Raw SQL detected outside Infrastructure layer!"
            exit 1
          fi

          echo "All security policy checks passed."

      - name: Install root dependencies
        run: npm ci

      - name: Verify Survey baseline fixture
        run: npm run test:fixtures

      - name: Restore .NET packages
        run: dotnet restore backend/TanErp.slnx

      - name: Build .NET solution
        run: dotnet build backend/TanErp.slnx --no-restore

      - name: Run .NET test suites (Unit, Architecture, Integration)
        run: dotnet test backend/TanErp.slnx --no-build

      - name: Install dotnet-ef tool
        run: dotnet tool install --global dotnet-ef --version 10.0.11

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --legacy-peer-deps

      - name: Check OpenAPI contract drift
        run: npm --prefix frontend run check:api

      - name: Run frontend verify (Lint, Typecheck, Test, Build)
        run: npm --prefix frontend run verify

      - name: Install Playwright browsers
        run: npx --prefix frontend playwright install chromium --with-deps

      - name: Run Database Migrations
        env:
          # The design-time DbContext factory reads the connection string from the environment (see the Makefile db-migrate target).
          ConnectionStrings__Database: "Host=localhost;Database=tan_erp;Username=postgres;Password=postgres"
        run: |
          dotnet ef database update \
            --project backend/src/TanErp.Infrastructure \
            --startup-project backend/src/TanErp.Api \
            --connection "Host=localhost;Database=tan_erp;Username=postgres;Password=postgres"

      - name: Seed Firebase Auth Emulator Users
        run: |
          # Wait for emulator port 9099
          until curl -s http://127.0.0.1:9099/ > /dev/null; do
            echo "Waiting for Firebase emulator..."
            sleep 1
          done
          node scripts/seed-emulator-users.mjs

      - name: Start Backend API (Background)
        env:
          ASPNETCORE_ENVIRONMENT: Test
          SeedTestData: "true"
          FIREBASE_AUTH_EMULATOR_HOST: "127.0.0.1:9099"
          Firebase__ProjectId: "tan-erp-test-only"
          ConnectionStrings__Database: "Host=localhost;Database=tan_erp;Username=postgres;Password=postgres"
        run: |
          dotnet run --no-launch-profile --project backend/src/TanErp.Api --urls http://localhost:5000 &
          until curl -s http://localhost:5000/api/v1/me > /dev/null; do
            echo "Waiting for Backend API..."
            sleep 1
          done

      - name: Start Frontend Server (Background)
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: "test-api-key"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "tan-erp-test-only.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "tan-erp-test-only"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:abcdef123456"
          NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_URL: "http://127.0.0.1:9099"
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:5000"
        run: |
          npm --prefix frontend run dev -- -p 3005 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3005/th/login > /dev/null; then
              echo "Frontend is ready on port 3005."
              exit 0
            fi
            sleep 1
          done
          echo "Frontend did not become ready on port 3005"
          exit 1

      - name: Run Playwright E2E Acceptance Journey
        env:
          PLAYWRIGHT_TEST_BASE_URL: "http://localhost:3005"
        run: npm --prefix frontend run test:e2e

      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: playwright-results
          path: frontend/test-results/
