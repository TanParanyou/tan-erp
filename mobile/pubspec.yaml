name: tan_erp_field
description: "TAN ERP field companion app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  dio: ^5.11.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  go_router: ^18.1.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  local_auth: ^3.0.2
  package_info_plus: ^10.2.2
  reactive_forms: ^18.2.2
  talker: ^5.2.0
  tan_erp_api:
    path: packages/tan_erp_api
  uuid: ^4.6.0

dev_dependencies:
  custom_lint: ^0.8.1
  erp_lints:
    path: packages/erp_lints
  flutter_test:
    sdk: flutter
  pigeon: ^26.3.2
  very_good_analysis: ^11.0.0

flutter:
  # Xcode 26 fails to compile firebase-ios-sdk's Package.swift manifest; build iOS via CocoaPods.
  config:
    enable-swift-package-manager: false
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
