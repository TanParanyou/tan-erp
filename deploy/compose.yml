services:
  postgres:
    image: postgres:17-alpine
    container_name: tan-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tan_erp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tan_erp}"]
      interval: 5s
      timeout: 5s
      retries: 5

  firebase-emulator:
    image: spine3/firebase-emulator:latest
    container_name: tan-erp-firebase-emulator
    restart: unless-stopped
    ports:
      - "9099:9099"
    volumes:
      - ../firebase.json:/firebase/firebase.json
    working_dir: /firebase
    entrypoint: ["firebase", "emulators:start", "--only", "auth", "--project", "tan-erp-test-only"]

volumes:
  postgres_data:
