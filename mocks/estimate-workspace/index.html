<main class="app" id="app" data-view="list">
<div class="top"><div class="brand"><span class="brandmark">PROJECT ERP</span><span data-i18n="title"></span></div><button id="language" aria-label="Switch language">EN</button></div>
<header class="identity"><div><div class="eyebrow muted" data-i18n="subtitle"></div><h1 data-i18n="project"></h1><div class="doc"><span class="mono small">EST-2026-0042</span><span class="muted">/</span><span class="small" id="revision-label"></span><span class="badge" id="lifecycle-badge"></span></div></div><p class="mocknote" data-i18n="mock"></p></header>

<nav class="mobile-nav"><button class="active" data-view="list" data-i18n="boq"></button><button data-view="detail" data-i18n="detail"></button></nav>
<div id="error" class="error" role="alert" hidden></div>
<div class="workspace"><section class="sheet"><div class="sheet-title"><div><h2 data-i18n="boq"></h2><span class="small muted" id="count"></span></div><div class="sheet-actions"><button id="add-section" data-i18n="addSection"></button><button id="template-open" data-i18n="template"></button><button id="add-work"><span aria-hidden="true">＋</span> <span data-i18n="addWork"></span></button></div></div><div class="toolbar"><div class="search"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6"/></svg><input id="search" data-placeholder="search" aria-label="Search"></div><div class="filters"><button class="active" data-filter="all" data-i18n="all"></button><button data-filter="low" data-i18n="low"></button></div></div><div class="table-wrap"><table><thead><tr><th data-i18n="work"></th><th class="num" data-i18n="qty"></th><th class="num" data-i18n="costTotal"></th><th class="num" data-i18n="sellTotal"></th><th class="num">GP%</th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty" data-i18n="noResults" hidden></div><div class="sheet-foot"><span data-i18n="filterOnly"></span><span class="mono">THB</span></div></section>

function renderMetrics(){const all=totals(),item=items[state.selected],c=calc(item);$('hud-cost').textContent=money(all.cost);$('hud-profit').textContent=money(all.net-all.cost);$('hud-net').textContent=money(all.net);$('hud-gp').textContent='GP '+all.gp.toFixed(1)+'%';$('hud-gp').className='badge '+(all.gp>=30?'good':'bad');$('active-code').textContent=item.code;$('active-name').textContent=text(item,'name');$('active-spec').textContent=text(item,'spec');$('active-health').textContent=t(c.gp>=30?'healthy':'warning');$('active-health').className='badge '+(c.gp>=30?'good':'bad');$('unit-cost').textContent=number(c.unit);$('unit-selling').textContent=money(c.sell);$('item-gp').textContent=c.gp.toFixed(1)+'%';$('formula').textContent=t(item.rule==='margin'?'formulaMargin':item.rule==='markup'?'formulaMarkup':'formulaFixed');$('rule-label').textContent=t(item.rule==='fixed'?'fixedValue':'ruleValue');$('fixed-reason-field').hidden=item.rule!=='fixed';$('summary-net').textContent=money(all.grand);for(const [id,value]of [['before-discount',all.selling],['discount-total',-all.discount],['net-total',all.net],['vat-total',all.vat],['grand-total',all.grand]])$(id).textContent=number(value);$('snapshot').textContent=state.snapshot?money(state.snapshot.total)+' · '+state.snapshot.time+(state.snapshot.stale?' · '+t('stale'):''):t('notCalculated');$('status').textContent=t(state.dirty?'dirty':state.status);item.costs.forEach((cost,i)=>{const el=$('cs-'+i);if(el)el.textContent=number(cost.qty*cost.cost);});}

function record(key){demo.audit.push({key,time:new Date().toLocaleTimeString(state.locale==='th'?'th-TH':'en-GB',{hour:'2-digit',minute:'2-digit'})});}

function openSection(group=null){demo.action=()=>{const th=$('section-th').value.trim(),en=$('section-en').value.trim();if(!th||!en){$('section-error').textContent=t('requiredName');$('section-th').focus();return false;}if(group){group.name={th,en};}else groups.push({id:'section-'+demo.nextGroup++,name:{th,en},collapsed:false});renderRows();renderInspector();dirty();return true;};$('action-title').textContent=t(group?'editSection':'addSection');$('action-body').innerHTML=`<div class="field"><label for="section-th">${t('sectionName')}</label><input id="section-th" value="${group?escape(group.name?.th??state.messages.th[group.key]):''}" required></div><div class="field"><label for="section-en">${t('sectionNameEn')}</label><input id="section-en" value="${group?escape(group.name?.en??state.messages.en[group.key]):''}" required></div><p id="section-error" role="alert" class="small"></p>`;$('action-confirm').textContent=t('apply');$('action-dialog').showModal();}
function addWork(groupId){if(!groups.length){openSection();return;}const group=groups.find(g=>g.id===groupId);group.collapsed=false;const item={code:'NEW-'+String(demo.nextItem++).padStart(3,'0'),nameKey:'newWork',specKey:'newSpec',group:group.id,qty:1,unit:'set',rule:'margin',value:30,reason:'',costs:[]};items.push(item);select(items.length-1);setTab('info');dirty();$('work-name').focus();}
function afterDelete(){state.selected=Math.max(0,Math.min(state.selected,items.length-1));renderRows();renderInspector();dirty();}
function catalogMatches(){return catalogData.filter(c=>(demo.catalogScope==='all'||c.cost!==null)&&(!demo.catalogType||c.type===demo.catalogType)&&(!demo.catalogCategory||c.category===demo.catalogCategory)&&(!demo.catalogBrand||c.brand===demo.catalogBrand)&&[c.id,t(c.key),t(c.category),c.brand].join(' ').toLowerCase().includes(demo.catalogQuery));}
function thumb(category){const paths={wood:'M4 9 22 3l14 7-18 7zM4 9v19l14 8 18-8V10M18 17v19M8 16l6 3M8 22l6 3',surface:'M5 5h30v30H5zM5 15h30M14 5v30M25 5v30',hardware:'M5 12h28v16H5zM10 12V6h7v6M22 28v7h7v-7M10 20h18',lighting:'M5 16h30v10H5zM10 20h2M18 20h2M26 20h2M5 10V6M20 10V4M35 10V6',service:'M8 32 26 8l8 6-18 24zM8 32l8 6M26 8l3-4 8 6-3 4'};return `<svg viewBox="0 0 40 42" aria-label="${t('catalogSpec')}" role="img"><path d="${paths[category]}"/></svg>`;}
function renderCatalog(){const all=catalogMatches(),pages=Math.max(1,Math.ceil(all.length/4));demo.catalogPage=Math.min(demo.catalogPage,pages-1);const page=all.slice(demo.catalogPage*4,demo.catalogPage*4+4),normal=demo.catalogMode==='normal'&&all.length>0;const feedback=demo.catalogMode==='loading'?'loading':demo.catalogMode==='error'?'loadError':'emptyCatalog';$('catalog-feedback').hidden=normal;$('catalog-feedback').textContent=t(feedback);$('catalog-retry').hidden=demo.catalogMode!=='error';document.querySelector('.catalog-table').hidden=!normal;$('catalog-list').innerHTML=normal?page.map(c=>`<tr><td><input class="catalog-check" type="checkbox" data-catalog-id="${c.id}" aria-label="${escape(t(c.key))}" ${demo.catalogSelected.has(c.id)?'checked':''} ${c.cost===null?'disabled':''}></td><td><div class="catalog-material"><div class="catalog-visual">${thumb(c.category)}</div><div><span class="mono small muted">${c.id}</span><strong>${t(c.key)}</strong><span class="small muted">${t(c.category)} · ${t(c.unit)}</span></div></div></td><td class="small muted">${c.brand==='local'?'Project ERP':c.brand}</td><td class="num">${c.cost!==null?`<strong class="money">${number(c.cost)}</strong><br><span class="small muted">THB / ${t(c.unit)} · V${c.version}</span>`:`<span class="no-price">${t('noCost')}</span><br><span class="small muted">${t('notSelectable')}</span>`}</td></tr>`).join(''):'';$('catalog-page').textContent=t('page')+' '+(demo.catalogPage+1)+' / '+pages+' · '+all.length+' '+t('component');$('catalog-prev').disabled=!normal||demo.catalogPage===0;$('catalog-next').disabled=!normal||demo.catalogPage>=pages-1;$('catalog-selected').textContent=t('selectedCount')+' '+demo.catalogSelected.size;$('catalog-insert').disabled=!demo.catalogSelected.size||!normal;$('catalog-insert').textContent=t('insertSelected')+' '+(items[state.selected]?.code??'')+' ('+demo.catalogSelected.size+')';$('catalog-target').textContent=t('targetWork')+' · '+items[state.selected].code+' · '+text(items[state.selected],'name');const eligible=page.filter(c=>c.cost!==null);const allSelected=eligible.length>0&&eligible.every(c=>demo.catalogSelected.has(c.id));$('catalog-select-page').textContent=t(allSelected?'deselectPage':'selectPage');$('catalog-select-page').disabled=!normal||eligible.length===0;}
function catalogReset(){demo.catalogPage=0;renderCatalog();}
$('catalog-open').onclick=()=>{demo.catalogSelected.clear();demo.catalogPage=0;demo.catalogQuery='';demo.catalogType='';demo.catalogCategory='';demo.catalogBrand='';demo.catalogScope='cost';demo.catalogMode='normal';for(const id of ['catalog-search','catalog-type','catalog-category','catalog-brand'])$(id).value='';$('catalog-scope').value='cost';$('catalog-mode').value='normal';renderCatalog();$('catalog-dialog').showModal();};
$('catalog-search').oninput=event=>{demo.catalogQuery=event.target.value.trim().toLowerCase();catalogReset();};for(const [id,key]of [['catalog-type','catalogType'],['catalog-category','catalogCategory'],['catalog-brand','catalogBrand'],['catalog-scope','catalogScope'],['catalog-mode','catalogMode']])$(id).onchange=event=>{demo[key]=event.target.value;catalogReset();};
$('catalog-clear').onclick=()=>{for(const [id,key]of [['catalog-search','catalogQuery'],['catalog-type','catalogType'],['catalog-category','catalogCategory'],['catalog-brand','catalogBrand']]){$(id).value='';demo[key]='';}catalogReset();};$('catalog-retry').onclick=()=>{demo.catalogMode='normal';$('catalog-mode').value='normal';renderCatalog();};$('catalog-prev').onclick=()=>{demo.catalogPage--;renderCatalog();};$('catalog-next').onclick=()=>{demo.catalogPage++;renderCatalog();};$('catalog-cancel').onclick=()=>$('catalog-dialog').close();$('catalog-list').onchange=event=>{const id=event.target.dataset.catalogId;if(!id)return;if(event.target.checked)demo.catalogSelected.add(id);else demo.catalogSelected.delete(id);renderCatalog();};$('catalog-select-page').onclick=()=>{const eligible=catalogMatches().slice(demo.catalogPage*4,demo.catalogPage*4+4).filter(c=>c.cost!==null),allSelected=eligible.every(c=>demo.catalogSelected.has(c.id));for(const c of eligible)if(allSelected)demo.catalogSelected.delete(c.id);else demo.catalogSelected.add(c.id);renderCatalog();};$('catalog-insert').onclick=()=>{for(const c of catalogData)if(demo.catalogSelected.has(c.id)&&c.cost!==null){items[state.selected].costs.push({...component(c.key,1,c.cost,c.unit),type:c.type,itemId:c.id,costRecordId:'CR-'+c.id,costRecordVersion:c.version,note:''});}record('insertSelected');$('catalog-dialog').close();renderComponents();dirty();};
$('add-section').onclick=()=>openSection();$('add-work').onclick=()=>addWork(items[state.selected]?.group??groups[0]?.id);$('action-cancel').onclick=()=>$('action-dialog').close();$('action-confirm').onclick=()=>{if(demo.action&&demo.action()!==false)$('action-dialog').close();};
$('duplicate-work').onclick=()=>{if(!items[state.selected])return;const original=items[state.selected],copy=JSON.parse(JSON.stringify(original));copy.code='COPY-'+String(demo.nextItem++).padStart(3,'0');copy.name={th:(original.name?.th??state.messages.th[original.nameKey])+' · '+state.messages.th.copySuffix,en:(original.name?.en??state.messages.en[original.nameKey])+' · '+state.messages.en.copySuffix};items.splice(state.selected+1,0,copy);select(state.selected+1);dirty();};for(const [id,direction]of [['move-up',-1],['move-down',1]])$(id).onclick=()=>{const index=state.selected,target=index+direction;if(!items[target]||items[target].group!==items[index].group)return;const moved=items.splice(index,1)[0];items.splice(target,0,moved);select(target);dirty();};$('delete-work').onclick=()=>askDelete(()=>{items.splice(state.selected,1);afterDelete();});
$('work-name-en').oninput=event=>{const item=items[state.selected];if(!item.name)item.name={th:state.messages.th[item.nameKey],en:state.messages.en[item.nameKey]};item.name.en=event.target.value;dirty();};$('work-group').onchange=event=>{items[state.selected].group=event.target.value;dirty();};$('components').addEventListener('input',event=>{const key=event.target.dataset.componentField;if(!key)return;const c=items[state.selected].costs[Number(event.target.dataset.index)];if(key==='description'){if(!c.description)c.description={th:state.messages.th[c.key],en:state.messages.en[c.key]};c.description[state.locale]=event.target.value;}else c[key]=event.target.value;dirty();});$('manual-add').onclick=()=>{items[state.selected].costs.push({...component('newCost',1,0,'lot','provisional'),type:'otherCost',reasonKey:'provisionalDefault',note:''});renderComponents();dirty();};
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.collapse){const g=groups.find(g=>g.id===button.dataset.collapse);g.collapsed=!g.collapsed;renderRows();}if(button.dataset.groupAdd)addWork(button.dataset.groupAdd);if(button.dataset.groupEdit)openSection(groups.find(g=>g.id===button.dataset.groupEdit));if(button.dataset.groupRemove)askDelete(()=>{const id=button.dataset.groupRemove;groups.splice(groups.findIndex(g=>g.id===id),1);for(let i=items.length-1;i>=0;i--)if(items[i].group===id)items.splice(i,1);afterDelete();});if(button.dataset.jump!==undefined){$('readiness-dialog').close();if(button.dataset.jump==='calculate')$('calculate').focus();else{select(Number(button.dataset.jump));setTab(button.dataset.jumpTab);$('panel-'+button.dataset.jumpTab).querySelector('input,button,select')?.focus();}}if(button.dataset.template!==undefined){if(!groups.length){$('template-dialog').close();openSection();return;}const copy=JSON.parse(JSON.stringify(templates[Number(button.dataset.template)]));copy.code='TPL-'+String(demo.nextItem++).padStart(3,'0');copy.group=items[state.selected]?.group??groups[0].id;items.push(copy);$('template-dialog').close();select(items.length-1);dirty();}});
$('template-open').onclick=()=>{$('template-list').innerHTML=templates.map((item,index)=>`<div class="catalog-entry"><div><strong>${escape(text(item,'name'))}</strong><span class="small muted">${escape(text(item,'spec'))}</span></div><button data-template="${index}">${t('addWork')}</button></div>`).join('');$('template-dialog').showModal();};$('template-close').onclick=()=>$('template-dialog').close();$('readiness-open').onclick=()=>{renderReadiness();$('readiness-dialog').showModal();};$('readiness-close').onclick=()=>$('readiness-dialog').close();
$('send-review').onclick=()=>{if(!state.snapshot||state.snapshot.stale||state.dirty||!items.length||items.some(item=>!item.costs.length)){$('error').textContent=t('reviewBlocked');$('error').hidden=false;renderReadiness();$('readiness-dialog').showModal();return;}demo.submitted=true;state.status='reviewSubmitted';record('reviewSubmitted');renderMetrics();};
const baseValidate=validate;
validate=function(){if(!baseValidate())return false;const invalid=items.findIndex(item=>item.costs.some(c=>c.source==='provisional'&&!(c.reason??(c.reasonKey?t(c.reasonKey):'')).trim()));if(invalid>=0){select(invalid);setTab('cost');$('error').textContent=t('invalid');$('error').hidden=false;return false;}return true;};
save=async function(calculate){if(state.pending||demo.approved||demo.submitted||!validate())return;state.pending=true;$('save').disabled=true;$('calculate').disabled=true;renderMetrics();$('status').textContent=t(calculate?'calculating':'saving');await new Promise(resolve=>setTimeout(resolve,700));const mode=$('save-mode').value;state.pending=false;$('save').disabled=false;$('calculate').disabled=false;if(mode==='conflict'||mode==='failure'){$('error').textContent=t(mode==='conflict'?'conflictMessage':'failureMessage');$('error').hidden=false;renderMetrics();return;}state.dirty=false;state.status=calculate?'calculated':'saved';record('saved');if(calculate&&mode==='calcFailure'){state.status='calcFailureMessage';$('error').textContent=t('calcFailureMessage');$('error').hidden=false;}else if(calculate){demo.version++;state.snapshot={...totals(),total:totals().grand,version:demo.version,time:new Date().toLocaleTimeString(state.locale==='th'?'th-TH':'en-GB',{hour:'2-digit',minute:'2-digit'}),stale:false};record('calculated');}$('error').hidden=calculate&&mode==='calcFailure'?false:true;renderMetrics();};
$('export').onclick=()=>{if(!state.snapshot)return;const s=state.snapshot,rows=[[t('snapshotVersion'),s.version],[t('cost'),s.cost],[t('beforeDiscount'),s.selling],[t('discount'),s.discount],[t('net'),s.net],[t('vat'),s.vat],[t('grand'),s.grand]];const csv='\uFEFF'+rows.map(row=>row.map(value=>'"'+String(value).replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),anchor=document.createElement('a');anchor.href=url;anchor.download='EST-2026-0042_mock_v'+s.version+'.csv';anchor.click();URL.revokeObjectURL(url);};
$('catalog-open-main').onclick=()=>{if(!items[state.selected])return;$('catalog-open').onclick();};$('catalog-work-target').onchange=event=>{state.selected=Number(event.target.value);renderRows();renderInspector();};
state.status='savedInitial';

$('review-open').onclick=()=>{$('return-error').textContent='';$('review-dialog').showModal();};$('review-close').onclick=()=>$('review-dialog').close();$('review-approve').onclick=()=>{demo.approved=true;demo.submitted=false;state.status='approved';record('approved');$('review-dialog').close();renderMetrics();};$('review-return').onclick=()=>{if(!$('return-reason').value.trim()){$('return-error').textContent=t('returnRequired');$('return-reason').focus();return;}demo.submitted=false;state.status='returned';record('returned');$('review-dialog').close();renderMetrics();};$('new-revision').onclick=()=>{askDelete(()=>{demo.approved=false;demo.submitted=false;demo.revision++;state.snapshot=null;state.dirty=false;state.status='revisionCreated';record('revisionCreated');renderMetrics();});$('action-title').textContent=t('newRevision');$('action-body').innerHTML='<p>'+t('revisionCreated')+'</p>';$('action-confirm').textContent=t('newRevision');};


state.messages=JSON.parse(document.getElementById('translations').textContent);localize();renderRows();renderInspector();setTab('cost');
</script>
