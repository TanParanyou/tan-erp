<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
  <title id="title">Quick Estimate mobile wireframe five-step flow</title>
  <desc id="desc">Five mobile screens show job selection, measurements, options, evidence and price, then review and sharing.</desc>
  <rect width="1440" height="1040" fill="#F4F6F9"/>
  <style>.p{fill:#fff;stroke:#0B3056;stroke-width:2}.n{fill:#0B3056}.f{fill:#fff;stroke:#7E95B0}.i{fill:#EBF1F7}.w{fill:#FFFBEB;stroke:#FDE68A}.t{fill:#0A192F;font:14px Arial,sans-serif}.m{fill:#536B88;font:12px Arial,sans-serif}.h{fill:#0A192F;font:bold 18px Arial,sans-serif}.l{fill:#fff;font:14px Arial,sans-serif}.r{stroke:#D1DEEC}</style>
  <text x="60" y="55" class="h" font-size="28">Quick Estimate · Mobile Field Workflow</text><text x="60" y="80" class="m">Low-fidelity · TEST_ONLY values · 44px actions</text>
  <g transform="translate(60 120)"><rect class="p" width="250" height="390"/><rect class="n" width="250" height="54"/><text x="16" y="33" class="l">1/5 งานและลูกค้า</text><text x="16" y="82" class="h">เลือกงาน</text><rect x="16" y="98" width="218" height="44" class="f"/><text x="28" y="126" class="t">คุณอร · บ้านนวลจันทร์</text><rect x="16" y="158" width="218" height="44" class="f"/><text x="28" y="186" class="t">Built-in · ตู้เสื้อผ้า</text><rect x="16" y="218" width="218" height="44" class="f"/><text x="28" y="246" class="t">ห้องนอนใหญ่</text><line x1="0" y1="326" x2="250" y2="326" class="r"/><rect x="126" y="338" width="108" height="40" class="n"/><text x="151" y="364" class="l">วัดขนาด →</text></g>
  <g transform="translate(345 120)"><rect class="p" width="250" height="390"/><rect class="n" width="250" height="54"/><text x="16" y="33" class="l">2/5 ขนาดหน้างาน</text><text x="16" y="82" class="h">ตู้เสื้อผ้า</text><rect x="16" y="102" width="150" height="44" class="f"/><text x="28" y="130" class="t">กว้าง 3.00</text><rect x="166" y="102" width="68" height="44" class="i"/><text x="190" y="130" class="t">m</text><rect x="16" y="166" width="218" height="44" class="f"/><text x="28" y="194" class="t">สูง 2.60 · ลึก 0.60</text><rect x="16" y="230" width="218" height="44" class="w"/><text x="28" y="258" class="m">Confidence: Medium</text><line x1="0" y1="326" x2="250" y2="326" class="r"/><rect x="126" y="338" width="108" height="40" class="n"/><text x="153" y="364" class="l">วัสดุ →</text></g>
  <g transform="translate(630 120)"><rect class="p" width="250" height="390"/><rect class="n" width="250" height="54"/><text x="16" y="33" class="l">3/5 วัสดุและเงื่อนไข</text><text x="16" y="82" class="h">Material Grade</text><rect x="16" y="98" width="104" height="50" class="f"/><text x="34" y="128" class="t">Standard</text><rect x="130" y="98" width="104" height="50" class="i"/><text x="150" y="128" class="t">Premium</text><text x="16" y="186" class="t">งานไฟซ่อน: ไม่แน่ใจ</text><text x="16" y="226" class="t">□ ยืนยัน Assumptions</text><text x="16" y="260" class="t">□ ยืนยัน Exclusions</text><rect x="16" y="280" width="218" height="32" class="w"/><text x="28" y="301" class="m">ต้อง Review: HIDDEN_SYSTEM</text><line x1="0" y1="326" x2="250" y2="326" class="r"/><rect x="126" y="338" width="108" height="40" class="n"/><text x="144" y="364" class="l">รูปและราคา →</text></g>
  <g transform="translate(345 570)"><rect class="p" width="250" height="390"/><rect class="n" width="250" height="54"/><text x="16" y="33" class="l">4/5 รูปและช่วงราคา</text><text x="16" y="82" class="h">หลักฐาน 2/3</text><rect x="16" y="98" width="64" height="50" class="i"/><text x="27" y="128" class="m">ภาพรวม ✓</text><rect x="92" y="98" width="64" height="50" class="i"/><text x="103" y="128" class="m">จุดยึด ✓</text><rect x="168" y="98" width="66" height="50" class="w"/><text x="184" y="128" class="m">งานไฟ +</text><rect x="16" y="170" width="218" height="106" class="i"/><text x="28" y="198" class="m">ช่วงราคาประเมิน</text><text x="28" y="234" class="h">฿43,000–59,000</text><text x="28" y="258" class="m">TEST_ONLY · ไม่รวม VAT</text><line x1="0" y1="326" x2="250" y2="326" class="r"/><rect x="126" y="338" width="108" height="40" class="n"/><text x="146" y="364" class="l">คำนวณใหม่</text></g>
  <g transform="translate(630 570)"><rect class="p" width="250" height="390"/><rect class="n" width="250" height="54"/><text x="16" y="33" class="l">5/5 ตรวจและส่งต่อ</text><rect x="16" y="76" width="218" height="44" class="w"/><text x="28" y="103" class="t">รอตรวจ · PendingReview</text><text x="16" y="158" class="h">สาเหตุ</text><text x="16" y="188" class="t">• งานไฟซ่อนยังไม่ยืนยัน</text><text x="16" y="218" class="t">• ต้องมีรูปจุดระบบเพิ่ม</text><text x="16" y="266" class="m">สรุปลูกค้า: ช่วงราคา · ขอบเขต</text><text x="16" y="290" class="m">ไม่ใช่ใบเสนอราคา</text><line x1="0" y1="326" x2="250" y2="326" class="r"/><rect x="16" y="338" width="218" height="40" class="n"/><text x="84" y="364" class="l">ส่งตรวจภายใน</text></g>
  <path d="M900 315h110v450h-110" fill="none" stroke="#0B3056" stroke-width="2"/><text x="1040" y="500" class="h">Reusable shell</text><text x="1040" y="534" class="t">Template controls fields.</text><text x="1040" y="562" class="t">Backend controls price and policy.</text><text x="1040" y="590" class="t">Shared results are versioned.</text>
</svg>
